site_name: reactmetric
site_description: "REACT: how long a trajectory forecast stays wrong after a change in motion."
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
  features:
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            docstring_style: google
            show_root_heading: true
            heading_level: 3
            members_order: source
            filters: ["!^_"]
  - mkdocs-jupyter:
      execute: false
      include: ["*.ipynb"]
      include_source: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# internal working notes, not part of the published docs
exclude_docs: |
  paper-todo.md
  todo-tonight.md
  revision-status.md
  rigor-review-*.md
  react-spec.md
  recovery-rule.md
  figures/

nav:
  - Home: index.md
  - Bring your own forecaster: forecasters.md
  - Choosing events: events.md
  - Reading results: results.md
  - Tutorial: tutorial.ipynb
  - The REACT metric: concepts.md
  - Calibration: calibration.md
  - I/O formats: io.md
  - Datasets: datasets.md
  - API overview: api.md
  - Reference: reference.md
