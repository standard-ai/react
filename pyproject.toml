[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reactmetric"
version = "0.2.0.dev0"
description = "REACT (Regime Event Adaptive Correction Time): a metric for how quickly trajectory forecasts recover usefulness after disruptive events."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Calvin Breseman" },
    { name = "David M. Woollard" },
]
keywords = [
    "trajectory-forecasting",
    "evaluation-metric",
    "changepoint-detection",
    "uncertainty-calibration",
    "information-theory",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.4", "pandas>=1.3"]
cpd = ["ruptures>=1.1"]
torch = ["torch>=1.12"]
datasets = ["pandas>=1.3", "pyarrow>=7.0", "PyYAML>=5.4"]
io = ["pandas>=1.3", "pyarrow>=7.0"]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "pandas>=1.3",
    "matplotlib>=3.4",
    "PyYAML>=5.4",
]
all = [
    "matplotlib>=3.4",
    "pandas>=1.3",
    "pyarrow>=7.0",
    "ruptures>=1.1",
    "PyYAML>=5.4",
    "torch>=1.12",
]

[project.scripts]
reactmetric = "reactmetric.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reactmetric"]

[tool.hatch.build.targets.wheel.force-include]
"src/reactmetric/baselines/checkpoints/gru_position_best.pt" = "reactmetric/baselines/checkpoints/gru_position_best.pt"
"src/reactmetric/baselines/checkpoints/gru_orientation_best.pt" = "reactmetric/baselines/checkpoints/gru_orientation_best.pt"
"src/reactmetric/baselines/checkpoints/NOTICE.md" = "reactmetric/baselines/checkpoints/NOTICE.md"
"src/reactmetric/datasets/data/eindhoven_sample.csv" = "reactmetric/datasets/data/eindhoven_sample.csv"
"src/reactmetric/datasets/data/EINDHOVEN_SAMPLE_NOTICE.md" = "reactmetric/datasets/data/EINDHOVEN_SAMPLE_NOTICE.md"

[tool.hatch.build.targets.sdist]
include = [
  "/src/reactmetric",
  "/tests",
  "/docs",
  "/examples",
  "/README.md",
  "/LICENSE",
  "/NOTICE",
  "/CHANGELOG.md",
  "/mkdocs.yml",
  "/pyproject.toml",
]
# internal working notes, paper-parity checks that need local clones, and run outputs
exclude = [
  "/docs/paper-todo.md",
  "/docs/todo-tonight.md",
  "/docs/revision-status.md",
  "/docs/rigor-review-*.md",
  "/docs/react-spec.md",
  "/docs/recovery-rule.md",
  "/tests/parity",
  "/examples/react_tutorial",
  "__pycache__",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# Keep typing.Optional/List/Tuple etc. rather than PEP 604/585 rewrites.
ignore = ["E741", "B008", "B905", "UP006", "UP007", "UP035", "UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
